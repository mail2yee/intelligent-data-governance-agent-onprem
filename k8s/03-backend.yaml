# Ported from docker-compose.yml's backend service, with
# docker-compose.camunda.yml's and datahub/docker-compose.datahub.yml's
# additive backend overrides folded in directly (CAMUNDA_BASE_URL /
# DATAHUB_API_URL pointed at the in-cluster camunda/datahub-gms
# Services) - unlike deploy.sh's local-dev/office split, this GKE demo
# always self-hosts everything, so there's no "fall back to config"
# branch to preserve here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: dgo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # See 01-mariadb.yaml's comment - avoids K8s's auto-injected
      # $<SERVICE>_PORT env vars colliding with this app's own vars.
      enableServiceLinks: false
      initContainers:
        # StatefulSet readiness alone doesn't block Deployment pods from
        # starting the way docker-compose's depends_on/service_healthy
        # does - wait for mariadb and camunda's ports to actually accept
        # connections before starting the app (mirrors
        # backend/entrypoint.sh's own assumption that these are already
        # up, e.g. `wren profile add` needs mariadb reachable
        # immediately).
        - name: wait-for-mariadb
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mariadb 3306; do echo waiting for mariadb; sleep 2; done"]
        - name: wait-for-camunda
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z camunda 8080; do echo waiting for camunda; sleep 2; done"]
        - name: wait-for-fab-business-db
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z fab-business-db 5432; do echo waiting for fab-business-db; sleep 2; done"]
      containers:
        - name: backend
          image: ghcr.io/mail2yee/intelligent-data-governance-agent-onprem-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: dgo-backend-secret
          env:
            - name: WREN_PROJECT_PATH
              value: /app/wren_project
            - name: CAMUNDA_BASE_URL
              value: http://camunda:8080/engine-rest
            - name: DATAHUB_API_URL
              value: http://datahub-gms:8080
            # Second WrenAI project (see 17-fab-business-db.yaml and
            # backend/app/integrations/business_data.py) - fake demo
            # credentials, same reasoning as that manifest's plain
            # POSTGRES_PASSWORD (not a real secret worth a K8s Secret).
            - name: WREN_BUSINESS_PROJECT_PATH
              value: /app/wren_business_capacity_plan
            - name: FAB_BUSINESS_DB_HOST
              value: fab-business-db
            - name: FAB_BUSINESS_DB_PORT
              value: "5432"
            - name: FAB_BUSINESS_DB_NAME
              value: capacity_mgmt
            - name: FAB_BUSINESS_DB_USER
              value: fab_ops
            - name: FAB_BUSINESS_DB_PASSWORD
              value: fab_ops
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: dgo
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
