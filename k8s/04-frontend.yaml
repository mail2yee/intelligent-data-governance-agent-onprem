# Ported from docker-compose.yml's frontend service. nginx.conf's
# `proxy_pass http://backend:8000/...` resolves via K8s's own DNS
# (backend.dgo.svc.cluster.local, or just "backend" since nginx runs in
# the same namespace) exactly like it resolves "backend" via Docker
# Compose's network today - no nginx.conf changes needed.
#
# The Service below is plain ClusterIP - the actual public entry point
# is 15-gateway.yaml + 16-gcp-backend-policy.yaml (GKE Gateway API +
# Identity-Aware Proxy), not a bare public IP. See k8s/README.md's
# "Restricting access with IAP" section for why: this deployment is
# meant for a specific person (a Google-account email allowlist), not
# the whole internet.
#
# No `cloud.google.com/neg`/`backend-config` annotations here (an
# earlier classic-Ingress attempt used those) - Gateway API's own
# controller manages NEGs and backend policy attachment itself via the
# HTTPRoute/GCPBackendPolicy objects instead, see 15-gateway.yaml's
# comment for why classic Ingress was abandoned.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: dgo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      # See 01-mariadb.yaml's comment - avoids K8s's auto-injected
      # $<SERVICE>_PORT env vars colliding with this app's own vars.
      enableServiceLinks: false
      containers:
        - name: frontend
          image: ghcr.io/mail2yee/intelligent-data-governance-agent-onprem-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: dgo
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
