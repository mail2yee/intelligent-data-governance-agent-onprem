# Ported from datahub/docker-compose.datahub.yml's
# system-update-quickstart service - a one-shot init job (creates Kafka
# topics, DataHub's MySQL schema, OpenSearch indices), not a long-running
# service, hence a Job here rather than a Deployment. datahub-gms and
# datahub-frontend's initContainers poll this Job's .status.succeeded
# before starting (see 00-namespace.yaml's RBAC for how).
apiVersion: batch/v1
kind: Job
metadata:
  name: datahub-system-update
  namespace: dgo
spec:
  backoffLimit: 3
  template:
    spec:
      # See 01-mariadb.yaml's comment - avoids K8s's auto-injected
      # $<SERVICE>_PORT env vars colliding with this app's own vars
      # (this Job sets DATAHUB_GMS_HOST/PORT too, same collision risk).
      enableServiceLinks: false
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z datahub-mysql 3306; do echo waiting for datahub-mysql; sleep 3; done
              until nc -z datahub-opensearch 9200; do echo waiting for datahub-opensearch; sleep 3; done
              until nc -z datahub-kafka 29092; do echo waiting for datahub-kafka; sleep 3; done
      containers:
        - name: datahub-system-update
          image: ghcr.io/mail2yee/datahub-upgrade:v1.5.0.6
          args: ["-u", "SystemUpdate"]
          env:
            - name: BACKFILL_BROWSE_PATHS_V2
              value: "true"
            - name: CREATE_USER
              value: "false"
            - name: CREATE_USER_PASSWORD
              value: datahub
            - name: CREATE_USER_USERNAME
              value: datahub
            - name: DATAHUB_BASE_PATH
              value: /
            - name: DATAHUB_GMS_BASE_PATH
              value: /
            - name: DATAHUB_GMS_HOST
              value: datahub-gms
            - name: DATAHUB_GMS_PORT
              value: "8080"
            - name: DATAHUB_PRECREATE_TOPICS
              value: "true"
            - name: DATAHUB_SQL_SETUP_ENABLED
              value: "true"
            - name: DATAHUB_TOKEN_SERVICE_SALT
              value: "DtFuVe+U7P8VgbGKCG5ZUFBWv3J5iMydW8WJjKGrkqo="
            - name: DATAHUB_TOKEN_SERVICE_SIGNING_KEY
              value: "jEuGYDOUJy/4urNQhUGQC3NOqoU8HhwGeDf4OfLcIBk="
            - name: EBEAN_DATASOURCE_DRIVER
              value: com.mysql.jdbc.Driver
            - name: EBEAN_DATASOURCE_HOST
              value: datahub-mysql:3306
            - name: EBEAN_DATASOURCE_PASSWORD
              value: datahub
            - name: EBEAN_DATASOURCE_URL
              value: "jdbc:mysql://datahub-mysql:3306/datahub?verifyServerCertificate=false&useSSL=true&useUnicode=yes&characterEncoding=UTF-8&enabledTLSProtocols=TLSv1.2"
            - name: EBEAN_DATASOURCE_USERNAME
              value: root
            - name: ELASTICSEARCH_BUILD_INDICES_CLONE_INDICES
              value: "false"
            - name: ELASTICSEARCH_HOST
              value: datahub-opensearch
            - name: ELASTICSEARCH_IMPLEMENTATION
              value: opensearch
            - name: ELASTICSEARCH_INDEX_BUILDER_MAPPINGS_REINDEX
              value: "true"
            - name: ELASTICSEARCH_INDEX_BUILDER_REFRESH_INTERVAL_SECONDS
              value: "3"
            - name: ELASTICSEARCH_INDEX_BUILDER_SETTINGS_REINDEX
              value: "true"
            - name: ELASTICSEARCH_PORT
              value: "9200"
            - name: ELASTICSEARCH_PROTOCOL
              value: http
            - name: ELASTICSEARCH_USE_SSL
              value: "false"
            - name: ENTITY_REGISTRY_CONFIG_PATH
              value: /datahub/datahub-gms/resources/entity-registry.yml
            - name: ENTITY_VERSIONING_ENABLED
              value: "true"
            - name: GRAPH_SERVICE_IMPL
              value: elasticsearch
            - name: KAFKA_BOOTSTRAP_SERVER
              value: datahub-kafka:29092
            - name: KAFKA_SCHEMAREGISTRY_URL
              value: http://datahub-gms:8080/schema-registry/api/
            - name: PARTITIONS
              value: "3"
            - name: REPROCESS_DEFAULT_BROWSE_PATHS_V2
              value: "false"
            - name: SCHEMA_REGISTRY_SYSTEM_UPDATE
              value: "true"
            - name: SCHEMA_REGISTRY_TYPE
              value: INTERNAL
            - name: SPRING_KAFKA_PROPERTIES_AUTO_REGISTER_SCHEMAS
              value: "true"
            - name: SPRING_KAFKA_PROPERTIES_USE_LATEST_VERSION
              value: "true"
            - name: USE_CONFLUENT_SCHEMA_REGISTRY
              value: "false"
          volumeMounts:
            - name: datahub-plugins
              mountPath: /etc/datahub/plugins
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 1.5Gi
      volumes:
        - name: datahub-plugins
          emptyDir: {}
