services:
  # Switched from Postgres to MariaDB (2026-08-26) - see HANDOFF.md's "DB
  # engine switched to MariaDB" section. Mirrored to GHCR via
  # scripts/mirror-image-to-ghcr.sh - confirmed the office network can't
  # reach Docker Hub directly but CAN reach ghcr.io (same path already
  # proven for backend/frontend below). This is a straight retag/push,
  # not a rebuild - all config here still happens the same way, via
  # environment/volumes, same as always.
  # **Dev-environment choice, not a production plan**: self-hosting like
  # this is fine for a personal/team dev environment, but revisit before
  # any shared/production deployment (K8s or otherwise), see HANDOFF.md.
  # To refresh the version: re-run the mirror script with a new source
  # tag, then update the tag below to match.
  mariadb:
    image: ghcr.io/mail2yee/mariadb:11.4
    # Pinned amd64 for the same reason as backend/frontend below - the
    # mirrored image is intentionally amd64 (the company's real target),
    # not this dev machine's native arch. Runs under QEMU emulation on
    # Apple Silicon (slower, but only matters for local dev).
    platform: linux/amd64
    environment:
      MARIADB_USER: dgo
      # Defaults to a weak password so `docker compose up` works with zero
      # setup for local dev - never rely on this default outside local dev.
      # Set a real MARIADB_PASSWORD in a root .env file (not committed) to
      # override it.
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-dgo}
      MARIADB_DATABASE: dgo
      # root password is otherwise required by the image and would
      # generate a random one on every container recreation - fixed to
      # avoid that surprise, even though nothing here uses the root user.
      MARIADB_ROOT_PASSWORD: ${MARIADB_PASSWORD:-dgo}
    ports:
      # Host port 3307, not MySQL's usual 3306 - a sibling project's own
      # unrelated MySQL container already claims 3306 on this dev
      # machine (confirmed the hard way). Container-to-container traffic
      # (backend -> mariadb, below) uses the container's internal 3306
      # regardless - this remap only affects access from outside Docker.
      - "3307:3306"
    volumes:
      - mariadbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u dgo -p${MARIADB_PASSWORD:-dgo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    # image + build both set on purpose: `docker compose build` (at home,
    # with internet access) tags the result as this ghcr.io name, then
    # `docker compose push` publishes it. On the (air-gapped) company
    # network, `docker compose pull && docker compose up` (no --build)
    # just pulls this image - no pip install / PyPI access needed there.
    image: ghcr.io/mail2yee/intelligent-data-governance-agent-onprem-backend:latest
    # Build context is the repo root, not ./backend, so the Dockerfile can
    # also COPY ../wren/project (the WrenAI semantic model) and
    # ../camunda/ (the BPMN process this app deploys itself, see
    # backend/entrypoint.sh) - see backend/Dockerfile.
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Forced to amd64: wrenai's Rust engine (wren-core-py) has no prebuilt
    # wheel for linux/aarch64 (see backend/Dockerfile's comment) - without
    # this, building on Apple Silicon would try to compile it from source
    # and fail (no Rust toolchain here on purpose). Runs under QEMU
    # emulation on arm64 dev machines - slower to build/start, but this is
    # also the real target platform for the company's (x86_64) servers.
    platform: linux/amd64
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: mysql+asyncmy://dgo:${MARIADB_PASSWORD:-dgo}@mariadb:3306/dgo
      # Read by wren/project/connection_profile.json at container startup
      # (backend/entrypoint.sh's `wren profile add`) - WrenAI needs its
      # own host/user/password/database fields, not just a DSN string.
      MARIADB_USER: dgo
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-dgo}
      MARIADB_DATABASE: dgo
      WREN_PROJECT_PATH: /app/wren_project
      # No CAMUNDA_BASE_URL/DATAHUB_API_URL override here on purpose -
      # deliberately left to fall through to backend/.env's own value
      # (loaded via env_file above) unless docker-compose.camunda.yml /
      # datahub/docker-compose.datahub.yml are also included, in which
      # case those files override these two to point at the locally
      # self-hosted service instead. See deploy.sh and HANDOFF.md's
      # "Self-hosted images with a config fallback" section - this is
      # what makes "self-hosted by default, company's real service if
      # the image isn't available" work with zero code changes.
    ports:
      - "8000:8000"
    depends_on:
      mariadb:
        condition: service_healthy

  frontend:
    image: ghcr.io/mail2yee/intelligent-data-governance-agent-onprem-frontend:latest
    build:
      context: ./frontend
      # Vite bakes VITE_API_KEY into the built JS at build time (not
      # read at container startup, unlike backend's env_file) - must
      # match backend's API_KEY (backend/.env) for requests to succeed
      # once API_KEY is actually set. Read from the repo-root .env (see
      # .env.example), same file POSTGRES_PASSWORD already uses.
      args:
        VITE_API_KEY: ${VITE_API_KEY:-}
    # Forced to amd64 for the same reason as backend's pin above, just a
    # different root cause: this had no platform pin at all when first
    # pushed, so it silently built for the dev machine's native arch
    # (arm64) and GHCR only ever got an arm64 manifest - which is why
    # `docker compose pull` succeeded for backend but failed for frontend
    # on the company's x86_64 servers (confirmed 2026-07-29). The
    # company's real target is x86_64, same as backend.
    platform: linux/amd64
    ports:
      - "8090:80"
    depends_on:
      - backend

volumes:
  mariadbdata:
