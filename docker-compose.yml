services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dgo
      # Defaults to a weak password so `docker compose up` works with zero
      # setup for local dev - never rely on this default outside local dev.
      # Set a real POSTGRES_PASSWORD in a root .env file (not committed) to
      # override it.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dgo}
      POSTGRES_DB: dgo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dgo"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://dgo:${POSTGRES_PASSWORD:-dgo}@postgres:5432/dgo
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
