services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dgo
      # Defaults to a weak password so `docker compose up` works with zero
      # setup for local dev - never rely on this default outside local dev.
      # Set a real POSTGRES_PASSWORD in a root .env file (not committed) to
      # override it.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dgo}
      POSTGRES_DB: dgo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dgo"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    # image + build both set on purpose: `docker compose build` (at home,
    # with internet access) tags the result as this ghcr.io name, then
    # `docker compose push` publishes it. On the (air-gapped) company
    # network, `docker compose pull && docker compose up` (no --build)
    # just pulls this image - no pip install / PyPI access needed there.
    image: ghcr.io/mail2yee/intelligent-data-governance-agent-onprem-backend:latest
    # Build context is the repo root, not ./backend, so the Dockerfile can
    # also COPY ../wren/project (the WrenAI semantic model) - see
    # backend/Dockerfile and app/integrations/wrenai_client.py.
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Forced to amd64: wrenai's Rust engine (wren-core-py) has no prebuilt
    # wheel for linux/aarch64 (see backend/Dockerfile's comment) - without
    # this, building on Apple Silicon would try to compile it from source
    # and fail (no Rust toolchain here on purpose). Runs under QEMU
    # emulation on arm64 dev machines - slower to build/start, but this is
    # also the real target platform for the company's (x86_64) servers.
    platform: linux/amd64
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://dgo:${POSTGRES_PASSWORD:-dgo}@postgres:5432/dgo
      # Read by wren/project/connection_profile.json at container startup
      # (backend/entrypoint.sh's `wren profile add`) - WrenAI needs its
      # own host/user/password/database fields, not just a DSN string.
      POSTGRES_USER: dgo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dgo}
      POSTGRES_DB: dgo
      WREN_PROJECT_PATH: /app/wren_project
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: ghcr.io/mail2yee/intelligent-data-governance-agent-onprem-frontend:latest
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
