services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dgo
      # Defaults to a weak password so `docker compose up` works with zero
      # setup for local dev - never rely on this default outside local dev.
      # Set a real POSTGRES_PASSWORD in a root .env file (not committed) to
      # override it.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dgo}
      POSTGRES_DB: dgo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dgo"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Camunda 7 (self-managed, REST API) - see
  # backend/app/integrations/camunda_client.py. Confirmed 2026-07-29 the
  # company's real instance is Camunda **7.22** (a correction from an
  # earlier, wrong Camunda 8/Zeebe assumption) - this runs the same
  # official image locally so the whole ticket -> approve -> Camunda
  # task-completion loop can be tested end-to-end without the company
  # network. Mapped to host port 8082 - 8080 is reserved for DataHub's
  # GMS (see datahub/ and DATAHUB_API_URL below; DataHub is run as its
  # own separate `datahub docker quickstart` stack, not part of this
  # compose file), and 8081 is taken by an unrelated project on this dev
  # machine.
  camunda:
    image: camunda/camunda-bpm-platform:7.22.0
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/engine-rest/engine"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    # image + build both set on purpose: `docker compose build` (at home,
    # with internet access) tags the result as this ghcr.io name, then
    # `docker compose push` publishes it. On the (air-gapped) company
    # network, `docker compose pull && docker compose up` (no --build)
    # just pulls this image - no pip install / PyPI access needed there.
    image: ghcr.io/mail2yee/intelligent-data-governance-agent-onprem-backend:latest
    # Build context is the repo root, not ./backend, so the Dockerfile can
    # also COPY ../wren/project (the WrenAI semantic model) and
    # ../camunda/ (the BPMN process this app deploys itself, see
    # backend/entrypoint.sh) - see backend/Dockerfile.
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Forced to amd64: wrenai's Rust engine (wren-core-py) has no prebuilt
    # wheel for linux/aarch64 (see backend/Dockerfile's comment) - without
    # this, building on Apple Silicon would try to compile it from source
    # and fail (no Rust toolchain here on purpose). Runs under QEMU
    # emulation on arm64 dev machines - slower to build/start, but this is
    # also the real target platform for the company's (x86_64) servers.
    platform: linux/amd64
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://dgo:${POSTGRES_PASSWORD:-dgo}@postgres:5432/dgo
      # Read by wren/project/connection_profile.json at container startup
      # (backend/entrypoint.sh's `wren profile add`) - WrenAI needs its
      # own host/user/password/database fields, not just a DSN string.
      POSTGRES_USER: dgo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dgo}
      POSTGRES_DB: dgo
      WREN_PROJECT_PATH: /app/wren_project
      # Container-network address of the camunda service above - the
      # .env.example default (localhost:8080) is for running Camunda
      # standalone outside Docker instead.
      CAMUNDA_BASE_URL: http://camunda:8080/engine-rest
      # DataHub (see datahub/seed_catalog.py) runs as its own independent
      # `datahub docker quickstart` stack on the host, not a service in
      # this compose file (mirrors the sibling agent_mem0_poc repo's
      # approach) - host.docker.internal is how a container reaches a
      # host-published port on macOS/Windows Docker Desktop (confirmed
      # already working for LLM_BASE_URL against local Ollama the same
      # way).
      DATAHUB_API_URL: http://host.docker.internal:8080
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      camunda:
        condition: service_healthy

  frontend:
    image: ghcr.io/mail2yee/intelligent-data-governance-agent-onprem-frontend:latest
    build: ./frontend
    # Forced to amd64 for the same reason as backend's pin above, just a
    # different root cause: this had no platform pin at all when first
    # pushed, so it silently built for the dev machine's native arch
    # (arm64) and GHCR only ever got an arm64 manifest - which is why
    # `docker compose pull` succeeded for backend but failed for frontend
    # on the company's x86_64 servers (confirmed 2026-07-29). The
    # company's real target is x86_64, same as backend.
    platform: linux/amd64
    # Not 8080: that's reserved for DataHub's GMS (a pre-existing local
    # install on this dev machine, shared with the sibling agent_mem0_poc
    # repo, confirmed already bound to host 8080) - see DATAHUB_API_URL
    # above.
    ports:
      - "8090:80"
    depends_on:
      - backend

volumes:
  pgdata:
